[package]
name = "fjarsyn-desktop"
description = "The Fjarsyn desktop screen-sharing application."
version = "0.4.0"
edition = "2024"

[[bin]]
name = "fjarsyn"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
directories = "6.0.0"
fjarsyn-engine = { path = "../fjarsyn-engine" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
iced = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "image-without-codecs",
    "tokio",
    "wgpu-bare",
] }
iced_core = { version = "0.14.0" }
iced_wgpu = { version = "0.14.0", default-features = false }
wgpu = { workspace = true }
bytemuck = { workspace = true }
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }
iced_fonts = { version = "0.3", features = ["lucide"] }

[dev-dependencies]
bytes = { workspace = true }
