[package]
name = "fjarsyn-engine"
description = "The headless application engine for Fjarsyn."
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
directories = "6.0.0"
ffmpeg-next = { version = "8.1.0", default-features = false, features = [
    "static",
    "codec",
    "format",
    "software-scaling",
] }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
mdns-sd = "0.20.1"
rand_core = { workspace = true }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing = { workspace = true }
uuid = { workspace = true }
webrtc = "0.14"
wgpu = { workspace = true }
windows = { workspace = true }
